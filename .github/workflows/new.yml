name: CI
on: 
  push:
    branches: 
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: mvn clean package

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: mvn test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
     # - uses: actions/checkout@v4
      - name: Deploy
        run:  echo "Deploying the code successfully"
    
          

  
